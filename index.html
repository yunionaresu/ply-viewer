<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>3D Gaussian Splat Viewer</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #111; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* 起動時のUI */
        #ui-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: rgba(17, 17, 17, 0.95); z-index: 10;
        }
        #file-input { display: none; }
        .btn {
            padding: 20px 40px; font-size: 20px; font-weight: bold; cursor: pointer;
            background-color: #ff2a5f; color: white; border: none; border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.2s;
        }
        .btn:active { background-color: #cc1e4a; }
        
        #close-btn {
            position: absolute; top: 20px; right: 20px; padding: 10px 20px; font-size: 16px;
            background-color: rgba(255, 255, 255, 0.2); color: white; border: none;
            border-radius: 8px; display: none; z-index: 10; backdrop-filter: blur(5px);
        }
        #viewer-container {
            width: 100vw; height: 100vh; display: none;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <!-- PLYだけでなく、Scaniverseが出力する .splat にも対応 -->
        <label for="file-input" class="btn">立体写真(PLY / SPLAT)を開く</label>
        <input type="file" id="file-input" accept=".ply,.splat">
        <p style="margin-top: 20px; color: #aaa; font-size: 14px;">Scaniverse等でエクスポートしたファイルを選択</p>
    </div>
    
    <button id="close-btn" onclick="location.reload()">別のファイルを開く</button>
    <div id="viewer-container"></div>

    <!-- Three.js と Gaussian Splats 3D ライブラリの読み込み -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
        }
    }
    </script>

    <script type="module">
        import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

        const fileInput = document.getElementById('file-input');
        const uiContainer = document.getElementById('ui-container');
        const viewerContainer = document.getElementById('viewer-container');
        const closeBtn = document.getElementById('close-btn');

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // UIを切り替え
            uiContainer.style.display = 'none';
            viewerContainer.style.display = 'block';
            closeBtn.style.display = 'block';

            // 端末のメモリ上でファイルを仮想URLに変換（通信は発生しないため高速）
            const fileUrl = URL.createObjectURL(file);

            // ファイルの拡張子を判定してフォーマットを指定
            const extension = file.name.split('.').pop().toLowerCase();
            let format = GaussianSplats3D.SceneFormat.Ply;
            if (extension === 'splat') {
                format = GaussianSplats3D.SceneFormat.Splat;
            }

            // ビューアーの初期化
            const viewer = new GaussianSplats3D.Viewer({
                'rootElement': viewerContainer,
                'cameraUp': [0, 1, 0],
                'initialCameraPosition': [0, 0, 5],
                'initialCameraLookAt': [0, 0, 0],
                // GitHub Pagesのような特殊なサーバー設定がない環境でも動かすためのセーフティ設定
                'sharedMemoryForWorkers': false 
            });

            // 3DGSファイルの読み込みと描画
            viewer.addSplatScene(fileUrl, {
                'format': format,
                'showLoadingUI': true,
                'splatAlphaRemovalThreshold': 5 // 浮遊しているノイズなどを軽く除去
            })
            .then(() => {
                viewer.start();
            })
            .catch((error) => {
                alert('ファイルの読み込みに失敗しました。');
                console.error(error);
                location.reload();
            });
        });

        // 起動時に自動でダイアログを開く（PCブラウザ向け）
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                try { fileInput.click(); } catch(e) {}
            }, 500);
        });
    </script>
</body>
</html>
