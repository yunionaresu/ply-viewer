<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>3D Gaussian Splat Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: #fff; font-family: -apple-system, sans-serif; }
        
        /* 起動時のUI */
        #ui-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(17, 17, 17, 0.95); z-index: 10; }
        #file-input { display: none; }
        .btn { padding: 20px 40px; font-size: 20px; font-weight: bold; cursor: pointer; background-color: #ff2a5f; color: white; border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.2s; }
        .btn:active { background-color: #cc1e4a; }
        
        #close-btn { position: absolute; top: 20px; right: 20px; padding: 10px 20px; font-size: 16px; background-color: rgba(255, 255, 255, 0.2); color: white; border: none; border-radius: 8px; display: none; z-index: 10; backdrop-filter: blur(5px); cursor: pointer; }
        #viewer-container { width: 100vw; height: 100vh; display: none; }
    </style>
</head>
<body>
    <div id="ui-container">
        <!-- .spz 形式を最優先で受付 -->
        <label for="file-input" class="btn">立体写真 (.spz / .splat) を開く</label>
        <input type="file" id="file-input" accept=".ply,.splat,.spz">
        <p style="margin-top: 20px; color: #aaa; font-size: 14px; text-align: center; line-height: 1.5;">
            ※Scaniverseからの書き出しは<br><strong style="color: #4cd964;">SPZ (.spz) 形式</strong>を推奨します
        </p>
    </div>
    
    <button id="close-btn" onclick="location.reload()">別のファイルを開く</button>
    <div id="viewer-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
        }
    }
    </script>

    <script type="module">
        import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

        const fileInput = document.getElementById('file-input');
        const uiContainer = document.getElementById('ui-container');
        const viewerContainer = document.getElementById('viewer-container');
        const closeBtn = document.getElementById('close-btn');

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            uiContainer.style.display = 'none';
            viewerContainer.style.display = 'block';
            closeBtn.style.display = 'block';

            const fileUrl = URL.createObjectURL(file);
            const extension = file.name.split('.').pop().toLowerCase();
            
            // 拡張子からフォーマットを自動判定（SPZ対応）
            let format = GaussianSplats3D.SceneFormat.Ply;
            if (extension === 'splat') {
                format = GaussianSplats3D.SceneFormat.Splat;
            } else if (extension === 'spz') {
                // SPZ形式（Scaniverse標準の超圧縮形式）の指定
                format = GaussianSplats3D.SceneFormat.Spz || 3;
            }

            // モバイル・iOSに特化したビューアーの初期化
            const viewer = new GaussianSplats3D.Viewer({
                'rootElement': viewerContainer,
                'cameraUp': [0, -1, -0.6], // Scaniverseの向きに合わせた初期角度
                'initialCameraPosition': [0, 0, 5],
                'initialCameraLookAt': [0, 0, 0],
                'sharedMemoryForWorkers': false, // iOS Safariでのエラー回避
                'gpuAcceleratedSort': true,
                'halfPrecisionCovariancesOnGPU': true // メモリ節約（スマホ向け）
            });

            viewer.addSplatScene(fileUrl, {
                'format': format,
                'showLoadingUI': true,
                'splatAlphaRemovalThreshold': 5 
            })
            .then(() => {
                viewer.start();
            })
            .catch((error) => {
                alert('読み込みに失敗しました。未対応の形式か、ファイルが破損している可能性があります。');
                console.error(error);
                location.reload();
            });
        });
    </script>
</body>
</html>
